<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Utility Bill Intake with graphical OCR extraction</title>
<desc id="desc">Two supported intake sources feed extraction. Five illustrative bill areas connect through OCR to their corresponding extracted fields. OCR reads image text; field identification organizes it. Readable email and PDF text use a separate direct extraction path. All values require validation by billing rules. No real bill data is shown.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="2"/></marker></defs>
