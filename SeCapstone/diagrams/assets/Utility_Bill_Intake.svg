<rect x="10" y="10" width="980" height="815"/>
<path d="M10 60 H990"/>
<rect x="60" y="85" width="360" height="90"/><rect x="580" y="85" width="360" height="90"/>
<path d="M240 175 V205 H760 V175"/>
<path d="M500 205 V240" marker-end="url(#arrow)"/>
<rect x="35" y="240" width="930" height="560"/>
<path d="M35 285 H965"/>
<path d="M60 315 H335 L380 360 V650 H60 Z M335 315 V360 H380"/>
<rect x="420" y="365" width="155" height="280"/>
<rect x="620" y="315" width="320" height="335"/>
<rect x="60" y="690" width="515" height="80"/>
<path d="M575 730 H780 V650" marker-end="url(#arrow)"/>
<path d="M940 605 H952 V810 H500 V855" marker-end="url(#arrow)"/>
</g>
<g fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
<text x="500" y="42">UTILITY BILL INTAKE</text>
<text x="240" y="116">Manager Upload</text><text x="240" y="145">Optional clear photo / scan</text>
<text x="760" y="116">Receive Billing Emails</text><text x="760" y="145">Property mailbox: text / attachments</text>
<text x="500" y="269">BILL EXTRACTION</text>
<text x="210" y="346">Illustrative bill image</text>
<text x="497" y="394">OCR</text><text x="497" y="427">Reads image</text><text x="497" y="451">text</text>
<text x="497" y="565">Field</text><text x="497" y="589">identification</text>
<text x="780" y="346">EXTRACTED BILL DETAILS</text>
<text x="317" y="719">Readable email / digital PDF</text><text x="317" y="751">Direct Text Extraction</text>
<text x="780" y="684">Values require validation</text>
<text x="500" y="881">To Billing Rules</text>
</g>
